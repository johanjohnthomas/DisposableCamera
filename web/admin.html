<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8c735"><meta name="description" content="View and download event photos."><meta name="robots" content="noindex"><title>Host — Ten Frames</title><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="style.css"><script type="module" src="admin.js"></script></head><body>
<header class="site-header"><a class="wordmark" href="./">TEN FRAMES</a><a class="admin-link" href="./">Back to camera ↗</a></header>
<main><section id="admin-login" class="admin-login"><h1>Host sign-in</h1><p>View and download guest photos.</p><form id="admin-form"><label for="email">Host email</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button class="button red" id="sign-in">Sign in</button></form><p class="status" id="login-status" role="status"></p><p class="fine-print">Host access is set up separately. Guest names cannot unlock this gallery.</p></section>
<section id="admin-gallery" class="gallery" hidden><div class="gallery-heading"><div><p class="event-name" id="event-title"></p><h1>Event photos</h1></div><span class="photo-count" id="photo-count"></span></div><div class="admin-toolbar"><label class="sr-only" for="search">Filter by guest name</label><input id="search" type="search" placeholder="Find a guest…"><button class="button outline" id="download-all">Download shown photos (.zip)</button><button class="text-button" id="refresh">Refresh</button><button class="text-button" id="sign-out">Sign out</button></div><p class="status" id="admin-status" role="status"></p><div id="photo-grid" class="photo-grid"></div><button class="button outline" id="load-more" hidden>Load more photos</button></section></main>

<dialog id="photo-dialog"><button class="dialog-close" aria-label="Close photo">×</button><img id="detail-photo" alt="Event photograph"><a class="button red" id="download-photo" download>Save photo</a></dialog></body></html>
